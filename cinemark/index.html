<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineMark – Film Analysis & Timestamp Logger</title>
  <!-- CDN versions are pinned so an upstream release can't silently break the page -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cinema: {
              950: '#0a0d14',
              900: '#111726',
              800: '#1a2235',
              700: '#28344d',
              600: '#3a4a6b',
              gold: '#f59e0b',
              amber: '#d97706'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0a0d14;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    /* Custom scrollbar for taxonomy and logs */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #111726; }
    ::-webkit-scrollbar-thumb { background: #28344d; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a4a6b; }

    /* The YouTube API swaps our placeholder div for an iframe; make it fill the frame */
    .yt-host iframe { width: 100%; height: 100%; border: 0; }

    /* Print / Save as PDF: hide the app, show the clean report */
    .print-only { display: none; }
    @media print {
      @page { margin: 0.6in; }
      body { background: #fff !important; color: #111 !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
    /* The report layout, shared by the on-screen preview and the printed page */
    .report { font-family: Georgia, 'Times New Roman', serif; color: #111; font-size: 11pt; line-height: 1.4; }
    .report h1 { font-size: 18pt; font-weight: bold; margin: 0 0 4pt; }
    .report h2 { font-size: 13pt; font-weight: bold; margin: 16pt 0 2pt; break-after: avoid; }
    .report .meta { color: #444; margin-bottom: 14pt; }
    .report .group-def { color: #555; font-style: italic; margin: 0 0 6pt; break-after: avoid; }
    .report table { width: 100%; border-collapse: collapse; margin-bottom: 6pt; }
    .report th, .report td { border: 1px solid #999; padding: 6pt; vertical-align: top; text-align: left; }
    .report th { background: #eee; }
    .report tr { break-inside: avoid; }
    .report img { width: 1.8in; display: block; margin-bottom: 4pt; }
    .report .time { font-family: ui-monospace, Menlo, monospace; white-space: nowrap; font-weight: bold; }
    .report .label { font-size: 8pt; text-transform: uppercase; letter-spacing: 0.05em; color: #666; }
    .report .pick { width: 1%; text-align: center; }
    .report .pick input { width: 15px; height: 15px; accent-color: #d97706; cursor: pointer; }
    .report tr.excluded td:not(.pick) { opacity: 0.3; }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-slate-950">

  <div id="root"></div>

  <!-- data-presets="react": only compile JSX; modern browsers run everything else natively -->
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo } = React;

    const STORAGE_KEY = 'cinemark.v3';
    const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
    const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform);
    const MOD_KEY = IS_MAC ? '⌘' : 'Ctrl';

    // DEFAULT FILM TECHNIQUE TAXONOMY
    const DEFAULT_TAXONOMY = {
      'Cinematography': [
        'Extreme Long Shot (ELS)', 'Long Shot (LS)', 'Medium Shot (MS)', 'Close-up (CU)', 'Extreme Close-up (ECU)',
        'Establishing Shot', 'Two-shot', 'Over-the-shoulder', 'High Angle', 'Low Angle', 'Eye-level', 'Dutch Angle',
        "Bird's-eye View", 'Pan / Tilt', 'Tracking / Dolly Shot', 'Crane / Aerial Shot', 'Handheld', 'Zoom',
        'Dolly Zoom', 'Long Take', 'Shallow Depth of Field', 'Deep Focus', 'Rack Focus'
      ],
      'Editing': [
        'Continuity Editing', 'Shot / Reverse Shot', 'Eyeline Match', 'Cross-cutting', 'Match Cut', 'Graphic Match',
        'Jump Cut', 'Smash Cut', 'Montage', 'Dissolve', 'Fade In / Fade Out', 'Wipe', 'L-Cut / J-Cut', 'Pacing / Rhythm'
      ],
      'Sound': [
        'Diegetic Sound', 'Non-diegetic Sound', 'Score', 'Leitmotif', 'Voiceover', 'Sound Bridge',
        'Sound Effects / Foley', 'Ambient Sound', 'Silence', 'Off-screen Sound', 'Contrapuntal Sound'
      ],
      'Mise-en-Scène': [
        'Setting / Location', 'High-key Lighting', 'Low-key Lighting', 'Chiaroscuro', 'Backlighting / Silhouette',
        'Color Palette', 'Costume / Makeup', 'Props', 'Blocking / Staging', 'Framing / Composition', 'Acting / Performance'
      ],
      'Narrative & Theory': [
        'POV Shot', 'Foreshadowing', 'Flashback / Flash-forward', 'Non-linear Narrative', 'Motif', 'Symbol',
        'Allegory', 'Irony', 'Character Arc', 'Subtext', 'Ideological Lens'
      ]
    };

    // One-line definitions, shown as hover tooltips and in the glossary tab
    const DEFINITIONS = {
      'Extreme Long Shot (ELS)': 'A vast view where the setting dominates and people look tiny.',
      'Long Shot (LS)': 'Shows a full body in its surroundings.',
      'Medium Shot (MS)': 'Frames a character from about the waist up.',
      'Close-up (CU)': 'A face or object fills the frame, emphasizing emotion or importance.',
      'Extreme Close-up (ECU)': 'A single detail — eyes, a hand, an object — fills the frame.',
      'Establishing Shot': 'A wide opening shot that tells us where (and sometimes when) we are.',
      'Two-shot': 'Two characters share the frame, highlighting their relationship.',
      'Over-the-shoulder': 'Filmed from behind one character, looking at another.',
      'High Angle': 'The camera looks down, making the subject seem small or vulnerable.',
      'Low Angle': 'The camera looks up, making the subject seem powerful or threatening.',
      'Eye-level': 'A neutral angle that puts the viewer on equal footing with the subject.',
      'Dutch Angle': 'A tilted frame that suggests unease, tension, or disorder.',
      "Bird's-eye View": 'Shot from directly overhead; detached or godlike.',
      'Pan / Tilt': 'The camera pivots side to side (pan) or up and down (tilt) from a fixed spot.',
      'Tracking / Dolly Shot': 'The camera physically moves alongside or toward the action.',
      'Crane / Aerial Shot': 'The camera rises above or sweeps over the scene.',
      'Handheld': 'Shaky, unstabilized camera that feels immediate, raw, or chaotic.',
      'Zoom': 'The lens magnifies the image without the camera moving.',
      'Dolly Zoom': 'Camera moves while zooming the opposite way; the background warps — a feeling of vertigo.',
      'Long Take': 'An unusually long shot with no cuts.',
      'Shallow Depth of Field': 'Only one plane is in focus, isolating the subject.',
      'Deep Focus': 'Foreground and background are both sharp.',
      'Rack Focus': 'Focus shifts from one plane to another mid-shot, redirecting attention.',
      'Continuity Editing': '"Invisible" cutting that keeps space and time easy to follow.',
      'Shot / Reverse Shot': 'Cuts back and forth between characters in a conversation.',
      'Eyeline Match': 'A cut that shows what a character is looking at.',
      'Cross-cutting': 'Alternates between events happening at the same time in different places.',
      'Match Cut': 'Links two shots through a matching action or movement.',
      'Graphic Match': 'Links two shots through similar shapes, colors, or composition.',
      'Jump Cut': 'An abrupt cut that skips forward in time within the same shot.',
      'Smash Cut': 'A sudden cut to a sharply contrasting scene or sound.',
      'Montage': 'A series of short shots that compresses time or builds an idea.',
      'Dissolve': 'One shot gradually blends into the next.',
      'Fade In / Fade Out': 'The image emerges from, or disappears into, black.',
      'Wipe': 'A new shot pushes the old one off the screen.',
      'L-Cut / J-Cut': "Sound from one shot carries over (or starts before) the cut to the next.",
      'Pacing / Rhythm': 'How shot length speeds up or slows down the scene.',
      'Diegetic Sound': 'Sound the characters can hear: dialogue, in-world music, noises.',
      'Non-diegetic Sound': 'Sound only the audience hears: score, narration, added effects.',
      'Score': 'Original music composed for the film.',
      'Leitmotif': 'A recurring musical theme tied to a character, place, or idea.',
      'Voiceover': 'Narration heard over the images.',
      'Sound Bridge': 'Sound that carries across a cut, linking two scenes.',
      'Sound Effects / Foley': 'Added everyday sounds — footsteps, doors, punches.',
      'Ambient Sound': 'The background sound of a place.',
      'Silence': 'The deliberate absence of sound, used for emphasis.',
      'Off-screen Sound': 'Sound whose source is outside the frame.',
      'Contrapuntal Sound': 'Sound or music that clashes with the mood of the image.',
      'Setting / Location': 'Where the scene takes place, and what that place suggests.',
      'High-key Lighting': 'Bright, even lighting with few shadows; open or cheerful.',
      'Low-key Lighting': 'Dark lighting with deep shadows; mystery or menace.',
      'Chiaroscuro': 'Strong contrast between light and dark.',
      'Backlighting / Silhouette': 'Light from behind the subject, sometimes leaving only an outline.',
      'Color Palette': 'The dominant colors of a scene and what they evoke.',
      'Costume / Makeup': 'What characters wear and how they look — and what that reveals.',
      'Props': 'Objects that carry dramatic or symbolic weight.',
      'Blocking / Staging': 'Where actors stand and move in relation to each other and the camera.',
      'Framing / Composition': 'How people and objects are arranged within the frame.',
      'Acting / Performance': 'Facial expression, gesture, movement, and voice.',
      'POV Shot': 'We see through a character\'s eyes.',
      'Foreshadowing': 'A hint of something that will happen later.',
      'Flashback / Flash-forward': 'The story jumps back or ahead in time.',
      'Non-linear Narrative': 'The story is told out of chronological order.',
      'Motif': 'A recurring image, sound, or idea.',
      'Symbol': 'Something concrete that stands for an abstract idea.',
      'Allegory': 'The whole story maps onto a larger idea, event, or situation.',
      'Irony': 'A gap between what is expected and what happens (or what is said and meant).',
      'Character Arc': 'How a character changes over the course of the film.',
      'Subtext': 'Meaning beneath what is directly said or shown.',
      'Ideological Lens': 'Reading the scene through a critical lens: class, gender, race, power…'
    };

    const SOURCES = [
      { id: 'local', label: 'Local Video', icon: 'fa-solid fa-file-video' },
      { id: 'youtube', label: 'YouTube', icon: 'fa-brands fa-youtube text-red-400' },
      { id: 'gdrive', label: 'Google Drive', icon: 'fa-brands fa-google-drive text-blue-400' },
      { id: 'stopwatch', label: 'Stopwatch', icon: 'fa-solid fa-stopwatch' }
    ];

    // ---------- Helpers ----------

    // Seconds -> "MM:SS", or "H:MM:SS" once a film passes the hour mark
    const formatTime = (secs) => {
      if (!Number.isFinite(secs) || secs < 0) secs = 0;
      secs = Math.floor(secs);
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = secs % 60;
      const pad = (n) => String(n).padStart(2, '0');
      return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    };

    // "84", "1:24", "1:02:03" -> seconds; null when it isn't a time
    const parseTime = (str) => {
      const parts = String(str).trim().split(':');
      if (parts.length > 3 || parts.some(p => !/^\d+$/.test(p))) return null;
      return parts.reduce((total, p) => total * 60 + Number(p), 0);
    };

    // Accepts watch, youtu.be, shorts, embed, live, and bare 11-character IDs
    const parseYoutubeUrl = (input) => {
      const s = input.trim();
      if (/^[\w-]{11}$/.test(s)) return s;
      const match = s.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/);
      return match ? match[1] : null;
    };

    const parseGDriveUrl = (input) => {
      const s = input.trim();
      const match = s.match(/\/file\/d\/([\w-]+)/) || s.match(/[?&]id=([\w-]+)/);
      if (match) return match[1];
      return /^[\w-]{25,}$/.test(s) ? s : null;
    };

    const makeId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    const csvCell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const mdCell = (v) => String(v ?? '').replace(/\|/g, '\\|').replace(/\s*\n\s*/g, ' ');
    const htmlEsc = (v) => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const htmlText = (v) => htmlEsc(v).replace(/\n/g, '<br>');
    const safeFilename = (s) => s.trim().replace(/[^\w\- ]+/g, '').replace(/\s+/g, '_');

    const downloadFile = (filename, content, type) => {
      const url = URL.createObjectURL(new Blob([content], { type }));
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    // Coerce anything loaded from storage or a project file into a well-formed entry
    const normalizeLog = (l) => ({
      id: String(l.id || makeId()),
      timestamp: Math.max(0, Math.floor(Number(l.timestamp) || 0)),
      tags: Array.isArray(l.tags) ? l.tags.map(String) : [],
      notes: String(l.notes || ''),
      effect: String(l.effect || ''),
      screenshot: typeof l.screenshot === 'string' && l.screenshot.startsWith('data:image/') ? l.screenshot : null,
      // Which video the entry came from, so ▶ in the timeline can replay it (blank on older entries)
      source: SOURCES.some(s => s.id === l.source) ? l.source : '',
      videoKey: String(l.videoKey || '')
    });

    const loadSaved = () => {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        return { ...data, logs: Array.isArray(data.logs) ? data.logs.map(normalizeLog) : [] };
      } catch (e) {
        return { logs: [] };
      }
    };

    // Load the YouTube IFrame API once; it lets us read the playhead and seek
    let ytApiPromise = null;
    const loadYouTubeApi = () => {
      if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
      if (!ytApiPromise) {
        ytApiPromise = new Promise((resolve, reject) => {
          const previous = window.onYouTubeIframeAPIReady;
          window.onYouTubeIframeAPIReady = () => { previous && previous(); resolve(window.YT); };
          const tag = document.createElement('script');
          tag.src = 'https://www.youtube.com/iframe_api';
          tag.onerror = () => { ytApiPromise = null; reject(new Error('YouTube API failed to load')); };
          document.head.appendChild(tag);
        });
      }
      return ytApiPromise;
    };

    const ytErrorMessage = (code) => ({
      2: "That doesn't look like a valid YouTube video.",
      5: "YouTube couldn't play this video in the browser.",
      100: 'This video was removed or is private.',
      101: "The video's owner doesn't allow it to be played on other sites.",
      150: "The video's owner doesn't allow it to be played on other sites.",
      api: "Couldn't reach YouTube. Check the internet connection or the school web filter."
    }[code] || 'YouTube refused to play this video here.');

    // ---------- Small components ----------

    function AddInput({ placeholder, onAdd, buttonLabel = 'Add' }) {
      const [value, setValue] = useState('');
      const submit = (e) => {
        e.preventDefault();
        if (onAdd(value.trim())) setValue('');
      };
      return (
        <form onSubmit={submit} className="flex gap-1.5">
          <input
            value={value}
            onChange={(e) => setValue(e.target.value)}
            placeholder={placeholder}
            aria-label={placeholder}
            className="flex-1 min-w-0 bg-cinema-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500"
          />
          <button type="submit" className="px-3 py-1.5 bg-cinema-700 hover:bg-cinema-600 text-slate-200 rounded-lg text-xs font-semibold whitespace-nowrap">
            <i className="fa-solid fa-plus mr-1"></i>{buttonLabel}
          </button>
        </form>
      );
    }

    function MetaField({ label, value, onChange, placeholder, width }) {
      return (
        <label className="flex items-center gap-2">
          <span className="text-slate-500 font-medium uppercase tracking-wider text-[10px]">{label}</span>
          <input
            type="text"
            value={value}
            placeholder={placeholder}
            onChange={(e) => onChange(e.target.value)}
            className={`bg-cinema-800 border border-slate-700 rounded px-2.5 py-1 text-slate-200 font-semibold placeholder-slate-600 placeholder:font-normal focus:outline-none focus:border-amber-500 ${width}`}
          />
        </label>
      );
    }

    function NavTab({ active, onClick, icon, children }) {
      return (
        <button
          onClick={onClick}
          aria-current={active ? 'page' : undefined}
          className={`px-4 py-2 rounded-lg font-semibold text-xs transition flex items-center gap-2 ${
            active ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-400 hover:text-slate-200'
          }`}
        >
          <i className={icon}></i>
          <span>{children}</span>
        </button>
      );
    }

    function ExportButton({ onClick, icon, children, primary }) {
      return (
        <button
          onClick={onClick}
          className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition ${
            primary ? 'bg-amber-500 hover:bg-amber-400 text-slate-950 shadow' : 'bg-cinema-800 hover:bg-cinema-700 text-slate-200 border border-slate-700'
          }`}
        >
          <i className={icon}></i>
          <span>{children}</span>
        </button>
      );
    }

    const PRINT_GROUPINGS = [
      { id: 'time', label: 'Film order' },
      { id: 'category', label: 'Category' },
      { id: 'technique', label: 'Technique' }
    ];
    const NO_EXCLUSIONS = new Set();

    // The organized report. With onToggle it's the interactive on-screen preview (include checkboxes);
    // without it, it's the printed page.
    function Report({ title, metaLine, groups, show, excluded, onToggle }) {
      const interactive = !!onToggle;
      return (
        <div className="report">
          <h1>Film Analysis: {title}</h1>
          <p className="meta">{[metaLine, new Date().toLocaleDateString()].filter(Boolean).join(' | ')}</p>
          {groups.map(group => (
            <section key={group.key}>
              {group.title && <h2>{group.title}</h2>}
              {group.subtitle && <p className="group-def">{group.subtitle}</p>}
              <table>
                <thead>
                  <tr>
                    {interactive && <th className="pick"><span className="sr-only">Include</span></th>}
                    <th style={{ width: '1%' }}>Time</th>
                    {show.tags && <th style={{ width: '22%' }}>Techniques</th>}
                    <th>Observation</th>
                  </tr>
                </thead>
                <tbody>
                  {group.entries.map(l => {
                    const off = excluded.has(l.id);
                    return (
                      <tr key={l.id} className={off ? 'excluded' : ''}>
                        {interactive && (
                          <td className="pick">
                            <input type="checkbox" checked={!off} onChange={() => onToggle(l.id)} aria-label={`Include the entry at ${formatTime(l.timestamp)}`} />
                          </td>
                        )}
                        <td className="time">{formatTime(l.timestamp)}</td>
                        {show.tags && <td>{l.tags.join(', ')}</td>}
                        <td>
                          {show.shots && l.screenshot && <img src={l.screenshot} alt="" />}
                          {l.notes && <div style={{ whiteSpace: 'pre-line' }}>{l.notes}</div>}
                          {show.effect && l.effect && (
                            <div style={{ marginTop: '4pt', whiteSpace: 'pre-line' }}>
                              <span className="label">Effect: </span>{l.effect}
                            </div>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </section>
          ))}
        </div>
      );
    }

    // ---------- App ----------

    function App() {
      const [saved] = useState(loadSaved);

      // Film & student metadata
      const [meta, setMeta] = useState({ filmTitle: '', director: '', studentName: '', classPeriod: '', ...saved.meta });
      const updateMeta = (key) => (value) => setMeta(m => ({ ...m, [key]: value }));

      // Video source state
      const [sourceMode, setSourceMode] = useState(saved.sourceMode || 'local');
      const [localVideoSrc, setLocalVideoSrc] = useState(null);
      const [localFileName, setLocalFileName] = useState(saved.localFileName || '');
      const [youtubeUrl, setYoutubeUrl] = useState('');
      const [youtubeId, setYoutubeId] = useState(saved.youtubeId || '');
      const [gdriveUrl, setGdriveUrl] = useState('');
      const [gdriveId, setGdriveId] = useState(saved.gdriveId || '');

      // Playback state (local video + YouTube)
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [playbackRate, setPlaybackRate] = useState(1);
      const [ytReady, setYtReady] = useState(false);
      const [ytError, setYtError] = useState(null);

      // Stopwatch: clock-based so it doesn't drift, used for Stopwatch and Google Drive modes
      const [sw, setSw] = useState({ baseMs: 0, startedAt: null });
      const [, setTick] = useState(0);

      // Taxonomy & observation form
      const [taxonomy, setTaxonomy] = useState(saved.taxonomy || DEFAULT_TAXONOMY);
      const [selectedCategoryTab, setSelectedCategoryTab] = useState(Object.keys(saved.taxonomy || DEFAULT_TAXONOMY)[0]);
      const [selectedTags, setSelectedTags] = useState([]);
      const [noteText, setNoteText] = useState('');
      const [effectText, setEffectText] = useState('');
      const [pinned, setPinnedState] = useState(null); // { seconds, screenshot } locked in for the entry being written
      const [pinnedInput, setPinnedInput] = useState('');
      const [editingLogId, setEditingLogId] = useState(null);

      // Observation timeline
      const [logs, setLogs] = useState(saved.logs);
      const [settings, setSettings] = useState({
        autoPause: true, printGroup: 'time', printTags: true, printEffect: true, printShots: true, ...saved.settings
      });
      const [printExcluded, setPrintExcluded] = useState(Array.isArray(saved.printExcluded) ? saved.printExcluded : []);

      // UI
      const [activeTab, setActiveTab] = useState('logger');
      const [searchFilter, setSearchFilter] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [showShortcutsModal, setShowShortcutsModal] = useState(false);
      const [toast, setToast] = useState(null);
      const [storageWarning, setStorageWarning] = useState(false);

      // Refs
      const videoRef = useRef(null);
      const fileInputRef = useRef(null);
      const projectInputRef = useRef(null);
      const ytContainerRef = useRef(null);
      const ytPlayerRef = useRef(null);
      const noteRef = useRef(null);
      const formRef = useRef(null);
      const toastTimer = useRef(null);
      const pinnedRef = useRef(null);
      const pendingPlayRef = useRef(null); // { mode, seconds } to play once a video finishes loading
      const playerCardRef = useRef(null);
      const playbackRateRef = useRef(1);
      const modeRef = useRef(sourceMode);
      modeRef.current = sourceMode;

      const activeCategory = taxonomy[selectedCategoryTab] ? selectedCategoryTab : Object.keys(taxonomy)[0];

      // Notification toast; an optional action renders a button (used for Undo)
      const showToast = (msg, opts = {}) => {
        clearTimeout(toastTimer.current);
        setToast({ msg, tone: opts.tone || 'ok', action: opts.action || null, key: makeId() });
        toastTimer.current = setTimeout(() => setToast(null), opts.duration || (opts.action ? 6000 : 3000));
      };

      // ---------- Autosave ----------
      // Debounced so typing in a field doesn't re-serialize every screenshot on each keystroke
      useEffect(() => {
        const t = setTimeout(() => {
          const data = { meta, logs, taxonomy, settings, printExcluded, sourceMode, youtubeId, gdriveId, localFileName };
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            setStorageWarning(false);
          } catch (e) {
            // Browser storage is full (screenshots are the big part): keep the text, drop the images
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...data, logs: logs.map(l => ({ ...l, screenshot: null })) }));
            } catch (e2) { /* storage unavailable entirely */ }
            setStorageWarning(true);
          }
        }, 400);
        return () => clearTimeout(t);
      }, [meta, logs, taxonomy, settings, printExcluded, sourceMode, youtubeId, gdriveId, localFileName]);

      // ---------- Stopwatch ----------
      useEffect(() => {
        if (sw.startedAt == null) return;
        const t = setInterval(() => setTick(n => n + 1), 250);
        return () => clearInterval(t);
      }, [sw.startedAt]);

      const swRunning = sw.startedAt != null;
      const swSeconds = Math.floor((sw.baseMs + (swRunning ? Date.now() - sw.startedAt : 0)) / 1000);
      const swToggle = () => setSw(s => s.startedAt != null
        ? { baseMs: s.baseMs + Date.now() - s.startedAt, startedAt: null }
        : { ...s, startedAt: Date.now() });
      const swNudge = (delta) => setSw(s => {
        const now = Date.now();
        const total = s.baseMs + (s.startedAt != null ? now - s.startedAt : 0);
        return { baseMs: Math.max(0, total + delta * 1000), startedAt: s.startedAt != null ? now : null };
      });
      const swReset = () => setSw({ baseMs: 0, startedAt: null });

      // ---------- YouTube player ----------
      useEffect(() => {
        if (!youtubeId) return;
        let cancelled = false;
        setYtReady(false);
        setYtError(null);
        loadYouTubeApi().then(YT => {
          if (cancelled || !ytContainerRef.current) return;
          const mount = document.createElement('div');
          ytContainerRef.current.innerHTML = '';
          ytContainerRef.current.appendChild(mount);
          ytPlayerRef.current = new YT.Player(mount, {
            videoId: youtubeId,
            width: '100%',
            height: '100%',
            playerVars: { rel: 0, playsinline: 1, ...(location.protocol.startsWith('http') ? { origin: location.origin } : {}) },
            events: {
              onReady: (e) => {
                if (cancelled) return;
                setYtReady(true);
                e.target.setPlaybackRate(playbackRateRef.current);
                const pending = pendingPlayRef.current;
                if (pending && pending.mode === 'youtube') {
                  pendingPlayRef.current = null;
                  e.target.seekTo(pending.seconds, true);
                  e.target.playVideo();
                }
              },
              onStateChange: (e) => {
                if (modeRef.current === 'youtube') setIsPlaying(e.data === YT.PlayerState.PLAYING);
              },
              onError: (e) => !cancelled && setYtError(e.data)
            }
          });
        }).catch(() => !cancelled && setYtError('api'));
        return () => {
          cancelled = true;
          try { ytPlayerRef.current && ytPlayerRef.current.destroy(); } catch (e) { /* already gone */ }
          ytPlayerRef.current = null;
          setYtReady(false);
          if (ytContainerRef.current) ytContainerRef.current.innerHTML = '';
        };
      }, [youtubeId]);

      // The YouTube API has no time-update event, so poll the playhead
      useEffect(() => {
        if (sourceMode !== 'youtube' || !ytReady) return;
        const t = setInterval(() => {
          const p = ytPlayerRef.current;
          if (!p || !p.getCurrentTime) return;
          setCurrentTime(p.getCurrentTime() || 0);
          setDuration(p.getDuration() || 0);
        }, 250);
        return () => clearInterval(t);
      }, [sourceMode, ytReady]);

      // ---------- Source handling ----------
      const canControlPlayer = (sourceMode === 'local' && !!localVideoSrc) || (sourceMode === 'youtube' && ytReady);
      const usesClock = sourceMode === 'stopwatch' || sourceMode === 'gdrive';

      const switchSource = (mode) => {
        if (mode === sourceMode) return;
        pendingPlayRef.current = null;
        if (videoRef.current) videoRef.current.pause();
        try { ytPlayerRef.current && ytPlayerRef.current.pauseVideo(); } catch (e) { /* not ready */ }
        setIsPlaying(false);
        if (mode === 'local' && videoRef.current) {
          setCurrentTime(videoRef.current.currentTime);
          setDuration(videoRef.current.duration || 0);
        } else {
          setCurrentTime(0);
          setDuration(0);
        }
        setSourceMode(mode);
      };

      const handleYoutubeSubmit = (e) => {
        e.preventDefault();
        const id = parseYoutubeUrl(youtubeUrl);
        if (id) {
          pendingPlayRef.current = null;
          setYoutubeId(id);
          setCurrentTime(0);
          setDuration(0);
          showToast('YouTube video loaded');
        } else {
          showToast("That doesn't look like a YouTube link.", { tone: 'warn' });
        }
      };

      const handleGDriveSubmit = (e) => {
        e.preventDefault();
        const id = parseGDriveUrl(gdriveUrl);
        if (id) {
          setGdriveId(id);
          swReset();
          showToast('Google Drive video loaded');
        } else {
          showToast("That doesn't look like a Google Drive file link.", { tone: 'warn' });
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file) return;
        if (localVideoSrc) URL.revokeObjectURL(localVideoSrc);
        setLocalVideoSrc(URL.createObjectURL(file));
        setLocalFileName(file.name);
        setCurrentTime(0);
        showToast(`Loaded ${file.name}`);
      };

      // Frame capture, downscaled so screenshots fit in browser storage
      const captureFrame = () => {
        const v = videoRef.current;
        if (sourceMode !== 'local' || !v || !v.videoWidth) return null;
        try {
          const scale = Math.min(1, 480 / v.videoWidth);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(v.videoWidth * scale);
          canvas.height = Math.round(v.videoHeight * scale);
          canvas.getContext('2d').drawImage(v, 0, 0, canvas.width, canvas.height);
          return canvas.toDataURL('image/jpeg', 0.65);
        } catch (e) {
          return null;
        }
      };

      // ---------- Playback controls ----------
      const getActiveSeconds = () => {
        if (sourceMode === 'local') return videoRef.current ? videoRef.current.currentTime : 0;
        if (sourceMode === 'youtube') {
          const p = ytPlayerRef.current;
          return p && p.getCurrentTime ? p.getCurrentTime() : 0;
        }
        return swSeconds;
      };
      const displaySeconds = usesClock ? swSeconds : currentTime;

      const togglePlay = () => {
        if (sourceMode === 'local' && videoRef.current) {
          const v = videoRef.current;
          if (v.paused) v.play().catch(() => {}); else v.pause();
        } else if (sourceMode === 'youtube' && ytReady) {
          const p = ytPlayerRef.current;
          if (p.getPlayerState() === YT.PlayerState.PLAYING) p.pauseVideo(); else p.playVideo();
        } else if (usesClock) {
          swToggle();
        }
      };

      // Only pauses players we control; the clock keeps running because the film keeps playing elsewhere
      const pausePlayback = () => {
        if (sourceMode === 'local' && videoRef.current) videoRef.current.pause();
        else if (sourceMode === 'youtube' && ytReady) ytPlayerRef.current.pauseVideo();
      };

      const seekTo = (seconds) => {
        const target = Math.max(0, duration ? Math.min(seconds, duration) : seconds);
        if (sourceMode === 'local' && videoRef.current) {
          videoRef.current.currentTime = target;
          setCurrentTime(target);
          return true;
        }
        if (sourceMode === 'youtube' && ytReady) {
          ytPlayerRef.current.seekTo(target, true);
          setCurrentTime(target);
          return true;
        }
        return false;
      };

      // Arrow keys: ±5s on a real player, ±1s nudge on the clock (to keep it in sync)
      const seekBy = (direction) => {
        if (canControlPlayer) seekTo(getActiveSeconds() + direction * 5);
        else if (usesClock) swNudge(direction);
      };

      const handleSpeedChange = (rate) => {
        setPlaybackRate(rate);
        playbackRateRef.current = rate;
        if (videoRef.current) videoRef.current.playbackRate = rate;
        try { ytPlayerRef.current && ytPlayerRef.current.setPlaybackRate(rate); } catch (e) { /* not ready */ }
      };

      const currentVideoKey = () => ({ local: localFileName, youtube: youtubeId, gdrive: gdriveId }[sourceMode] || '');

      // Bring the player back on screen when ▶ is pressed from further down the page
      const scrollPlayerIntoView = () => {
        const el = playerCardRef.current;
        const header = document.querySelector('header');
        if (!el) return;
        // The sticky header's height varies with screen width, so measure it rather than guess
        const gap = el.getBoundingClientRect().top - (header ? header.offsetHeight : 0) - 12;
        if (gap < 0) window.scrollBy({ top: gap, behavior: 'smooth' });
      };

      // Timeline ▶: switch to the video the entry was logged from, jump to its time, and play
      const jumpToLog = (log) => {
        const mode = log.source || sourceMode;
        const t = log.timestamp;
        const chooseFile = { label: 'Choose file', run: () => fileInputRef.current.click() };

        if (mode === 'stopwatch') {
          showToast('This entry was timed with the stopwatch, so there is no video here to replay.');
          return;
        }
        switchSource(mode);
        scrollPlayerIntoView();

        if (mode === 'local') {
          const v = videoRef.current;
          if (!v || (log.videoKey && localFileName && log.videoKey !== localFileName)) {
            // Play it as soon as the right file is loaded (see onLoadedMetadata)
            pendingPlayRef.current = { mode, seconds: t };
            const name = log.videoKey || localFileName;
            showToast(name ? `Open ${name} to play this moment.` : 'Open the video file to play this moment.', { action: chooseFile });
            return;
          }
          v.currentTime = t;
          setCurrentTime(t);
          v.play().catch(() => {});
        } else if (mode === 'youtube') {
          const id = log.videoKey || youtubeId;
          if (!id) {
            showToast('Load the YouTube video first, then press ▶ again.');
          } else if (id !== youtubeId || !ytReady) {
            // Play it once the player finishes loading (see onReady)
            pendingPlayRef.current = { mode, seconds: t };
            if (id !== youtubeId) setYoutubeId(id);
          } else {
            ytPlayerRef.current.seekTo(t, true);
            ytPlayerRef.current.playVideo();
            setCurrentTime(t);
          }
        } else if (mode === 'gdrive') {
          // Drive's player can't be controlled from another page, so line the clock up and say where to drag
          const id = log.videoKey || gdriveId;
          if (id && id !== gdriveId) setGdriveId(id);
          setSw({ baseMs: t * 1000, startedAt: null });
          showToast(`Drag Drive's slider to ${formatTime(t)}, then press play and Start clock. The clock is already set to ${formatTime(t)}.`, { duration: 7000 });
        }
      };

      // ---------- Pinning the timestamp ----------
      // The time locks in when you start an entry (M key, picking a technique, or typing),
      // not when you finish writing it — otherwise the stamp drifts while you type.
      const setPinned = (value) => {
        pinnedRef.current = value;
        setPinnedState(value);
        setPinnedInput(value ? formatTime(value.seconds) : '');
      };

      const pinNow = ({ pause = settings.autoPause } = {}) => {
        setPinned({ seconds: Math.floor(getActiveSeconds()), screenshot: captureFrame() });
        if (pause) pausePlayback();
      };

      const ensurePinned = () => {
        if (!pinnedRef.current) pinNow();
      };

      const commitPinnedInput = () => {
        const secs = parseTime(pinnedInput);
        if (secs == null) {
          setPinnedInput(pinned ? formatTime(pinned.seconds) : '');
          if (pinnedInput.trim()) showToast('Type the time like 1:24 or 1:02:03.', { tone: 'warn' });
          return;
        }
        if (pinned && secs === pinned.seconds) return;
        // A hand-typed time no longer matches the captured frame, so drop it
        setPinned({ seconds: secs, screenshot: null });
      };

      const quickMark = () => {
        pinNow();
        setTimeout(() => noteRef.current && noteRef.current.focus(), 0);
      };

      // ---------- Observation form ----------
      const toggleTag = (tag) => {
        ensurePinned();
        setSelectedTags(tags => tags.includes(tag) ? tags.filter(t => t !== tag) : [...tags, tag]);
      };
      const removeSelectedTag = (tag) => setSelectedTags(tags => tags.filter(t => t !== tag));

      const resetForm = () => {
        setSelectedTags([]);
        setNoteText('');
        setEffectText('');
        setPinned(null);
        setEditingLogId(null);
      };

      const handleSaveLog = () => {
        if (selectedTags.length === 0 && !noteText.trim() && !effectText.trim()) {
          showToast('Pick at least one technique or write a note first.', { tone: 'warn' });
          return;
        }
        const stamp = pinned || { seconds: Math.floor(getActiveSeconds()), screenshot: captureFrame() };
        const fields = {
          timestamp: stamp.seconds,
          tags: selectedTags,
          notes: noteText.trim(),
          effect: effectText.trim(),
          screenshot: stamp.screenshot
        };
        if (editingLogId) {
          setLogs(prev => prev.map(l => l.id === editingLogId ? { ...l, ...fields } : l));
          showToast(`Updated entry at ${formatTime(stamp.seconds)}`);
        } else {
          setLogs(prev => [...prev, { id: makeId(), source: sourceMode, videoKey: currentVideoKey(), ...fields }]);
          showToast(`Logged ${formatTime(stamp.seconds)}`);
        }
        resetForm();
      };

      const handleEditLog = (log) => {
        setEditingLogId(log.id);
        setSelectedTags(log.tags);
        setNoteText(log.notes);
        setEffectText(log.effect);
        setPinned({ seconds: log.timestamp, screenshot: log.screenshot });
        setActiveTab('logger');
        setTimeout(() => formRef.current && formRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }), 0);
      };

      const handleDeleteLog = (log) => {
        setLogs(prev => prev.filter(l => l.id !== log.id));
        if (editingLogId === log.id) resetForm();
        showToast(`Deleted entry at ${formatTime(log.timestamp)}`, {
          action: { label: 'Undo', run: () => setLogs(prev => [...prev, log]) }
        });
      };

      // ---------- Keyboard shortcuts ----------
      // The listener is registered once and always calls the latest handlers through this ref,
      // so it never acts on stale state (the old version could resurrect deleted entries).
      const keyHandlers = useRef({});
      keyHandlers.current = { togglePlay, seekBy, quickMark, handleSaveLog, activeTab, showShortcutsModal, setShowShortcutsModal };

      useEffect(() => {
        const onKeyDown = (e) => {
          const h = keyHandlers.current;
          const el = document.activeElement;
          const typing = el && (['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName) || el.isContentEditable);

          if (e.key === 'Escape') {
            if (h.showShortcutsModal) h.setShowShortcutsModal(false);
            else if (typing) el.blur();
            return;
          }
          if (typing) {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && el.closest('[data-log-form]')) {
              e.preventDefault();
              h.handleSaveLog();
            }
            return;
          }
          if (h.activeTab !== 'logger' || h.showShortcutsModal || e.metaKey || e.ctrlKey || e.altKey) return;

          if (e.code === 'Space') {
            e.preventDefault();
            h.togglePlay();
          } else if (e.code === 'KeyM') {
            e.preventDefault();
            h.quickMark();
          } else if (e.code === 'ArrowLeft') {
            e.preventDefault();
            h.seekBy(-1);
          } else if (e.code === 'ArrowRight') {
            e.preventDefault();
            h.seekBy(1);
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      // ---------- Derived data ----------
      const tagCategory = useMemo(() => {
        const map = {};
        Object.entries(taxonomy).forEach(([cat, tags]) => tags.forEach(t => { if (!map[t]) map[t] = cat; }));
        return map;
      }, [taxonomy]);

      // A log's categories come from its tags, so mixed entries show up under every filter they belong to
      const categoriesOf = (log) => [...new Set(log.tags.map(t => tagCategory[t] || 'Other'))];

      const sortedLogs = useMemo(() => [...logs].sort((a, b) => a.timestamp - b.timestamp), [logs]);
      const hasOther = sortedLogs.some(l => l.tags.some(t => !tagCategory[t]));

      const filteredLogs = sortedLogs.filter(log => {
        const q = searchFilter.trim().toLowerCase();
        const matchesSearch = !q ||
          log.notes.toLowerCase().includes(q) ||
          log.effect.toLowerCase().includes(q) ||
          log.tags.some(t => t.toLowerCase().includes(q)) ||
          formatTime(log.timestamp).includes(q);
        const matchesCategory = categoryFilter === 'All' || categoriesOf(log).includes(categoryFilter);
        return matchesSearch && matchesCategory;
      });

      // ---------- Exports ----------
      const filmLabel = meta.filmTitle.trim() || 'Untitled film';
      const baseName = [safeFilename(meta.filmTitle) || 'Film', safeFilename(meta.studentName)].filter(Boolean).join('_');
      const metaLine = [
        meta.director && `Director: ${meta.director}`,
        meta.studentName && `Student: ${meta.studentName}`,
        meta.classPeriod && `Class: ${meta.classPeriod}`
      ].filter(Boolean).join(' | ');

      const requireLogs = () => {
        if (logs.length) return true;
        showToast('Nothing to export yet — log a few moments first.', { tone: 'warn' });
        return false;
      };

      // ---------- Organize & print ----------
      const excludedSet = useMemo(() => new Set(printExcluded), [printExcluded]);
      const includedLogs = sortedLogs.filter(l => !excludedSet.has(l.id));
      const printShow = { tags: settings.printTags, effect: settings.printEffect, shots: settings.printShots };
      const toggleExcluded = (id) => setPrintExcluded(ids => ids.includes(id) ? ids.filter(x => x !== id) : [...ids, id]);

      // Split entries into report sections. By category or technique, an entry with several
      // tags appears under each one; headings follow the order of the technique list.
      const buildGroups = (entries) => {
        const mode = settings.printGroup;
        if (mode !== 'category' && mode !== 'technique') {
          return entries.length ? [{ key: 'all', title: null, subtitle: null, entries }] : [];
        }
        const groups = new Map();
        const add = (key, title, subtitle, entry) => {
          if (!groups.has(key)) groups.set(key, { key, title, subtitle, entries: [] });
          groups.get(key).entries.push(entry);
        };
        entries.forEach(l => {
          if (!l.tags.length) return add('_untagged', 'No techniques tagged', null, l);
          const keys = mode === 'category' ? categoriesOf(l) : l.tags;
          keys.forEach(k => add(k, k, mode === 'technique' ? DEFINITIONS[k] || null : null, l));
        });
        const order = mode === 'category' ? [...Object.keys(taxonomy), 'Other'] : Object.values(taxonomy).flat();
        const rank = (key) => key === '_untagged' ? Infinity : (order.includes(key) ? order.indexOf(key) : order.length);
        return [...groups.values()].sort((a, b) => rank(a.key) - rank(b.key) || a.title.localeCompare(b.title));
      };
      const previewGroups = buildGroups(sortedLogs);
      const printGroups = buildGroups(includedLogs);

      const requirePrintable = () => {
        if (!requireLogs()) return false;
        if (includedLogs.length) return true;
        showToast('No entries are selected — tick at least one in the preview.', { tone: 'warn' });
        return false;
      };

      // Pastes the same organized layout as the printed page
      const copyForDocs = () => {
        if (!requirePrintable()) return;
        const head = `<tr><th>Time</th>${printShow.tags ? '<th>Techniques</th>' : ''}<th>What happens on screen</th>${printShow.effect ? '<th>Effect / why it matters</th>' : ''}</tr>`;
        const html = `<h2>Film Analysis: ${htmlEsc(filmLabel)}</h2>${metaLine ? `<p>${htmlEsc(metaLine)}</p>` : ''}` +
          printGroups.map(g => {
            const rows = g.entries.map(l =>
              `<tr><td><b>${formatTime(l.timestamp)}</b></td>${printShow.tags ? `<td>${htmlEsc(l.tags.join(', '))}</td>` : ''}<td>${htmlText(l.notes)}</td>${printShow.effect ? `<td>${htmlText(l.effect)}</td>` : ''}</tr>`
            ).join('');
            return (g.title ? `<h3>${htmlEsc(g.title)}</h3>` : '') + (g.subtitle ? `<p><i>${htmlEsc(g.subtitle)}</i></p>` : '') +
              `<table border="1" cellpadding="6" style="border-collapse:collapse"><thead>${head}</thead><tbody>${rows}</tbody></table>`;
          }).join('');
        const text = `Film Analysis: ${filmLabel}\n${metaLine}\n\n` + printGroups.map(g =>
          (g.title ? `== ${g.title} ==\n` : '') + g.entries.map(l =>
            `[${formatTime(l.timestamp)}]${printShow.tags && l.tags.length ? ` ${l.tags.join(', ')}` : ''}\n${l.notes}${printShow.effect && l.effect ? `\nEffect: ${l.effect}` : ''}`
          ).join('\n\n')
        ).join('\n\n');
        const write = window.ClipboardItem
          ? navigator.clipboard.write([new ClipboardItem({
              'text/html': new Blob([html], { type: 'text/html' }),
              'text/plain': new Blob([text], { type: 'text/plain' })
            })])
          : navigator.clipboard.writeText(text);
        write
          .then(() => showToast('Copied! Paste into a Google Doc.'))
          .catch(() => showToast("Couldn't reach the clipboard — try Download CSV instead.", { tone: 'warn' }));
      };

      const exportMarkdown = () => {
        if (!requireLogs()) return;
        let md = `# Film Analysis: ${filmLabel}\n`;
        if (metaLine) md += `**${metaLine}**\n`;
        md += `\n| Timestamp | Techniques | What happens on screen | Effect / why it matters |\n|---|---|---|---|\n`;
        sortedLogs.forEach(l => {
          md += `| ${formatTime(l.timestamp)} | ${mdCell(l.tags.join(', '))} | ${mdCell(l.notes)} | ${mdCell(l.effect)} |\n`;
        });
        navigator.clipboard.writeText(md)
          .then(() => showToast('Markdown copied to clipboard'))
          .catch(() => showToast("Couldn't reach the clipboard.", { tone: 'warn' }));
      };

      const exportCSV = () => {
        if (!requireLogs()) return;
        const rows = [['Timestamp', 'Techniques', 'Categories', 'What happens on screen', 'Effect / why it matters']];
        sortedLogs.forEach(l => rows.push([formatTime(l.timestamp), l.tags.join('; '), categoriesOf(l).join('; '), l.notes, l.effect]));
        // The BOM makes Excel read accented characters (Mise-en-Scène) correctly
        const csv = '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
        downloadFile(`${baseName}_Analysis.csv`, csv, 'text/csv;charset=utf-8');
        showToast('Downloaded CSV');
      };

      const printReport = () => {
        if (requirePrintable()) window.print();
      };

      const saveProject = () => {
        const data = { app: 'CineMark', version: 3, savedAt: new Date().toISOString(), meta, logs, taxonomy };
        downloadFile(`${baseName}.cinemark.json`, JSON.stringify(data, null, 2), 'application/json');
        showToast('Project file saved');
      };

      const openProject = (e) => {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file) return;
        file.text().then(text => {
          const data = JSON.parse(text);
          if (!data || !Array.isArray(data.logs)) throw new Error('not a project');
          if (logs.length && !window.confirm('Replace your current entries with the ones in this file?')) return;
          setMeta(m => ({ ...m, ...data.meta }));
          setLogs(data.logs.map(normalizeLog));
          setPrintExcluded([]);
          if (data.taxonomy && typeof data.taxonomy === 'object') setTaxonomy(data.taxonomy);
          resetForm();
          showToast(`Opened ${file.name}`);
        }).catch(() => showToast("That file isn't a CineMark project.", { tone: 'warn' }));
      };

      const startNewAnalysis = () => {
        if (logs.length && !window.confirm(`Start a new analysis? This clears all ${logs.length} entries. (Save a project file first if you want to keep them.)`)) return;
        setLogs([]);
        setPrintExcluded([]);
        setMeta(m => ({ ...m, filmTitle: '', director: '' }));
        resetForm();
        swReset();
        showToast('Started a new analysis');
      };

      // ---------- Taxonomy management ----------
      const addTag = (cat, name) => {
        if (!name) return false;
        if (tagCategory[name]) {
          showToast(`"${name}" is already in ${tagCategory[name]}.`, { tone: 'warn' });
          return false;
        }
        setTaxonomy(t => ({ ...t, [cat]: [...t[cat], name] }));
        return true;
      };
      const removeTag = (cat, name) => setTaxonomy(t => ({ ...t, [cat]: t[cat].filter(x => x !== name) }));
      const addCategory = (name) => {
        if (!name) return false;
        if (taxonomy[name]) {
          showToast('That category already exists.', { tone: 'warn' });
          return false;

                      {selectedTags.length > 0 && (
                        <div className="space-y-1">
                          <span className="text-[10px] uppercase text-slate-400 font-bold tracking-wider">Selected ({selectedTags.length}):</span>
                          <div className="flex flex-wrap gap-1">
                            {selectedTags.map(tag => (
                              <span key={tag} className="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-[11px] pl-2 pr-1 py-0.5 rounded-md flex items-center gap-1">
                                {tag}
                                <button onClick={() => removeSelectedTag(tag)} aria-label={`Remove ${tag}`} className="px-1 hover:text-amber-200">
                                  <i className="fa-solid fa-xmark text-[10px]"></i>
                                </button>
                              </span>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* Notes */}
                      <div className="space-y-1">
                        <label htmlFor="notes" className="text-xs text-slate-300 font-medium">What happens on screen?</label>
                        <textarea
                          id="notes"
                          ref={noteRef}
                          rows={3}
                          placeholder="e.g., The camera stays low as the officer walks in, so he towers over the room..."
                          value={noteText}
                          onFocus={ensurePinned}
                          onChange={(e) => { ensurePinned(); setNoteText(e.target.value); }}
                          className="w-full bg-cinema-950 border border-slate-700 rounded-xl p-3 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition resize-y"
                        ></textarea>
                      </div>

                      <div className="space-y-1">
                        <label htmlFor="effect" className="text-xs text-slate-300 font-medium flex items-center justify-between">
                          <span>Effect: why does it matter?</span>
                          <span className="text-[10px] text-slate-500">Mood, character, theme, meaning</span>
                        </label>
                        <textarea
                          id="effect"
                          rows={3}
                          placeholder="e.g., It makes him feel threatening and shows who holds the power in this scene..."
                          value={effectText}
                          onFocus={ensurePinned}
                          onChange={(e) => { ensurePinned(); setEffectText(e.target.value); }}
                          className="w-full bg-cinema-950 border border-slate-700 rounded-xl p-3 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition resize-y"
                        ></textarea>
                      </div>

                      <label className="flex items-center gap-2 text-[11px] text-slate-400 cursor-pointer select-none">
                        <input
                          type="checkbox"
                          checked={settings.autoPause}
                          onChange={(e) => setSettings(s => ({ ...s, autoPause: e.target.checked }))}
                          className="accent-amber-500"
                        />
                        Pause the video while I write an entry
                      </label>

                      <button
                        type="button"
                        onClick={handleSaveLog}
                        className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl transition shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2"
                      >
                        <i className="fa-solid fa-floppy-disk"></i>
                        {editingLogId ? 'Update Entry' : 'Save to Timeline'}
                        <kbd className="text-[10px] bg-slate-950/20 px-1.5 py-0.5 rounded font-mono">{MOD_KEY}+Enter</kbd>
                      </button>
                    </div>
                  </div>
                </div>

                {/* TIMELINE */}
                <div className="bg-cinema-900 rounded-2xl border border-slate-800 p-5 shadow-xl space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4">
                    <div className="flex items-center gap-2">
                      <i className="fa-solid fa-timeline text-amber-400 text-base"></i>
                      <h2 className="font-bold text-sm text-slate-100">Observation Timeline</h2>
                      <span className="text-xs text-slate-400 bg-cinema-950 px-2.5 py-0.5 rounded-full border border-slate-800">
                        {filteredLogs.length === logs.length ? `${logs.length} entries` : `${filteredLogs.length} of ${logs.length}`}
                      </span>
                    </div>

                    <div className="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                      <div className="relative flex-1 sm:w-48">
                        <i className="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-xs"></i>
                        <input
                          type="text"
                          placeholder="Search notes or tags..."
                          aria-label="Search entries"
                          value={searchFilter}
                          onChange={(e) => setSearchFilter(e.target.value)}
                          className="w-full bg-cinema-950 border border-slate-700 rounded-xl pl-8 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      <select
                        value={categoryFilter}
                        onChange={(e) => setCategoryFilter(e.target.value)}
                        aria-label="Filter by category"
                        className="bg-cinema-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500"
                      >
                        <option value="All">All Categories</option>
                        {Object.keys(taxonomy).map(cat => <option key={cat} value={cat}>{cat}</option>)}
                        {hasOther && <option value="Other">Other</option>}
                      </select>
                    </div>
                  </div>

                  {filteredLogs.length === 0 ? (
                    <div className="text-center py-12 text-slate-500 space-y-2">
                      <i className="fa-solid fa-box-open text-3xl"></i>
                      {logs.length === 0 ? (
                        <p className="text-xs max-w-sm mx-auto">
                          Nothing logged yet. When you notice a technique, press <kbd className="text-amber-400 font-mono">M</kbd> (or click a technique), describe it, then save.
                        </p>
                      ) : (
                        <p className="text-xs">No entries match that search.</p>
                      )}
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                      {filteredLogs.map(log => (
                        <div
                          key={log.id}
                          className={`bg-cinema-950 rounded-xl border p-4 space-y-2 transition ${
                            editingLogId === log.id ? 'border-amber-500/60' : 'border-slate-800 hover:border-slate-700'
                          }`}
                        >
                          <div className="flex items-center justify-between border-b border-slate-800/80 pb-2 gap-2">
                            <button
                              onClick={() => jumpToLog(log)}
                              title="Play from this moment"
                              className="font-mono text-sm font-bold text-amber-400 bg-amber-500/10 hover:bg-amber-500/20 px-2.5 py-1 rounded-lg border border-amber-500/30 flex items-center gap-1.5 transition"
                            >
                              <i className="fa-solid fa-play text-[10px]"></i>
                              <span>{formatTime(log.timestamp)}</span>
                            </button>
                            <span className="text-[10px] text-slate-500 truncate flex-1">{categoriesOf(log).join(' · ')}</span>
                            <div className="flex items-center gap-1">
                              <button onClick={() => handleEditLog(log)} className="p-1.5 text-slate-400 hover:text-amber-400 transition" title="Edit entry" aria-label="Edit entry">
                                <i className="fa-solid fa-pen"></i>
                              </button>
                              <button onClick={() => handleDeleteLog(log)} className="p-1.5 text-slate-400 hover:text-rose-400 transition" title="Delete entry" aria-label="Delete entry">
                                <i className="fa-solid fa-trash-can"></i>
                              </button>
                            </div>
                          </div>

                          {log.screenshot && (
                            <img src={log.screenshot} alt={`Frame at ${formatTime(log.timestamp)}`} className="w-full h-32 object-cover rounded-lg border border-slate-800" />
                          )}

                          {log.tags.length > 0 && (
                            <div className="flex flex-wrap gap-1">
                              {log.tags.map(tag => (
                                <span key={tag} title={DEFINITIONS[tag] || ''} className="bg-cinema-800 text-slate-300 text-[10px] px-2 py-0.5 rounded border border-slate-700 font-medium">
                                  {tag}
                                </span>
                              ))}
                            </div>
                          )}

                          {log.notes && (
                            <p className="text-xs text-slate-300 leading-relaxed whitespace-pre-line">{log.notes}</p>
                          )}
                          {log.effect && (
                            <p className="text-xs text-slate-300 leading-relaxed bg-cinema-900/60 p-2.5 rounded-lg border border-slate-800/80 whitespace-pre-line">
                              <span className="text-[10px] font-bold uppercase tracking-wider text-amber-400/80 block mb-0.5">Effect</span>
                              {log.effect}
                            </p>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* VIEW 2: TECHNIQUES & GLOSSARY */}
            {activeTab === 'techniques' && (
              <div className="bg-cinema-900 rounded-2xl border border-slate-800 p-6 shadow-xl space-y-6">
                <div className="flex flex-wrap items-start justify-between gap-4 border-b border-slate-800 pb-4">
                  <div>
                    <h2 className="text-base font-bold text-slate-100 flex items-center gap-2">
                      <i className="fa-solid fa-tags text-amber-400"></i>
                      Techniques & Glossary
                    </h2>
                    <p className="text-xs text-slate-400">The techniques students can tag, with definitions. Add your own or remove ones you don't teach.</p>
                  </div>
                  <div className="flex flex-wrap items-center gap-2">
                    <div className="w-60"><AddInput placeholder="New category name" buttonLabel="Category" onAdd={addCategory} /></div>
                    <button onClick={resetTaxonomy} className="px-3 py-1.5 text-xs text-slate-400 hover:text-amber-400 flex items-center gap-1.5">
                      <i className="fa-solid fa-rotate-left"></i> Reset to defaults
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {Object.keys(taxonomy).map(category => (
                    <div key={category} className="bg-cinema-950 rounded-xl border border-slate-800 p-4 space-y-3 flex flex-col">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                        <h3 className="font-bold text-xs text-amber-400 uppercase tracking-wider">{category}</h3>
                        <button onClick={() => removeCategory(category)} className="text-slate-500 hover:text-rose-400 text-xs" title="Delete category" aria-label={`Delete ${category}`}>
                          <i className="fa-solid fa-trash-can"></i>
                        </button>
                      </div>
                      <ul className="space-y-1.5 flex-1 max-h-96 overflow-y-auto pr-1">
                        {taxonomy[category].map(tag => (
                          <li key={tag} className="group flex items-start justify-between gap-2 text-xs">
                            <div>
                              <span className="text-slate-200 font-semibold">{tag}</span>
                              {DEFINITIONS[tag] && <span className="text-slate-400"> — {DEFINITIONS[tag]}</span>}
                            </div>
                            <button
                              onClick={() => removeTag(category, tag)}
                              aria-label={`Remove ${tag}`}
                              className="text-slate-600 hover:text-rose-400 opacity-0 group-hover:opacity-100 focus:opacity-100 transition"
                            >
                              <i className="fa-solid fa-xmark"></i>
                            </button>
                          </li>
                        ))}
                      </ul>
                      <AddInput placeholder="Add a technique" onAdd={(name) => addTag(category, name)} />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 3: EXPORT */}
            {activeTab === 'export' && (
              <div className="space-y-6">
                <div className="bg-cinema-900 rounded-2xl border border-slate-800 p-6 shadow-xl space-y-5">
                  <div className="flex flex-wrap items-start justify-between gap-4 border-b border-slate-800 pb-4">
                    <div>
                      <h2 className="text-base font-bold text-slate-100 flex items-center gap-2">
                        <i className="fa-solid fa-print text-amber-400"></i>
                        Organize & Print
                      </h2>
                      <p className="text-xs text-slate-400 max-w-xl">Choose how to group your notes and which entries to include. The page below is exactly what prints, and what Copy for Google Docs pastes.</p>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      <ExportButton onClick={printReport} icon="fa-solid fa-print" primary>Print / Save PDF</ExportButton>
                      <ExportButton onClick={copyForDocs} icon="fa-solid fa-copy">Copy for Google Docs</ExportButton>
                    </div>
                  </div>

                  <div className="flex flex-wrap items-center gap-x-8 gap-y-3 text-xs">
                    <div className="flex flex-wrap items-center gap-2">
                      <span className="text-slate-400 font-medium">Organize by:</span>
                      <div className="flex bg-cinema-950 p-1 rounded-xl border border-slate-800">
                        {PRINT_GROUPINGS.map(g => (
                          <button
                            key={g.id}
                            onClick={() => setSettings(s => ({ ...s, printGroup: g.id }))}
                            aria-pressed={settings.printGroup === g.id}
                            className={`px-3 py-1.5 rounded-lg font-semibold transition ${
                              settings.printGroup === g.id ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-slate-200'
                            }`}
                          >
                            {g.label}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="flex flex-wrap items-center gap-3 text-slate-400">
                      <span className="font-medium">Show:</span>
                      {[['printTags', 'Techniques'], ['printEffect', 'Effect'], ['printShots', 'Screenshots']].map(([key, label]) => (
                        <label key={key} className="flex items-center gap-1.5 cursor-pointer select-none">
                          <input
                            type="checkbox"
                            checked={settings[key]}
                            onChange={(e) => setSettings(s => ({ ...s, [key]: e.target.checked }))}
                            className="accent-amber-500"
                          />
                          {label}
                        </label>
                      ))}
                    </div>

                    {logs.length > 0 && (
                      <div className="flex items-center gap-2 text-slate-400">
                        <span><b className="text-slate-200">{includedLogs.length}</b> of {logs.length} entries included</span>
                        <button onClick={() => setPrintExcluded([])} className="text-amber-400 hover:underline">All</button>
                        <span className="text-slate-600">·</span>
                        <button onClick={() => setPrintExcluded(logs.map(l => l.id))} className="text-amber-400 hover:underline">None</button>
                      </div>
                    )}
                  </div>

                  {settings.printGroup !== 'time' && logs.length > 0 && (
                    <p className="text-[11px] text-slate-500 -mt-2">
                      An entry tagged with more than one {settings.printGroup === 'category' ? 'category' : 'technique'} appears under each. Unticking it leaves it out everywhere.
                    </p>
                  )}

                  <div className="bg-white rounded-xl p-6 md:p-10 overflow-x-auto shadow-inner">
                    {logs.length === 0 ? (
                      <p className="text-slate-500 text-sm">No entries yet — log a few moments in the Analysis Room and they'll appear here.</p>
                    ) : (
                      <Report title={filmLabel} metaLine={metaLine} groups={previewGroups} show={printShow} excluded={excludedSet} onToggle={toggleExcluded} />
                    )}
                  </div>
                </div>

                <div className="bg-cinema-900 rounded-2xl border border-slate-800 p-6 shadow-xl space-y-3">
                  <h2 className="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <i className="fa-solid fa-table text-amber-400"></i>
                    Spreadsheet & Other Formats
                  </h2>
                  <p className="text-xs text-slate-400 max-w-2xl">Every entry in film order, regardless of the layout above. Good for sorting in Google Sheets.</p>
                  <div className="flex flex-wrap gap-2">
                    <ExportButton onClick={exportCSV} icon="fa-solid fa-file-csv">Download CSV</ExportButton>
                    <ExportButton onClick={exportMarkdown} icon="fa-brands fa-markdown">Copy Markdown</ExportButton>
                  </div>
                </div>

                <div className="bg-cinema-900 rounded-2xl border border-slate-800 p-6 shadow-xl space-y-3">
                  <h2 className="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <i className="fa-solid fa-folder-open text-amber-400"></i>
                    Project File
                  </h2>
                  <p className="text-xs text-slate-400 max-w-2xl">
                    Your work autosaves in this browser, but only on this computer. Save a project file to switch computers, keep a backup, or turn in your full log, screenshots included.
                  </p>
                  <div className="flex flex-wrap gap-2">
                    <ExportButton onClick={saveProject} icon="fa-solid fa-download">Save project file</ExportButton>
                    <ExportButton onClick={() => projectInputRef.current.click()} icon="fa-solid fa-folder-open">Open project file</ExportButton>
                    <button onClick={startNewAnalysis} className="px-4 py-2 rounded-xl text-xs font-bold text-rose-300 hover:bg-rose-500/10 border border-rose-500/30 flex items-center gap-2">
                      <i className="fa-solid fa-file-circle-plus"></i> Start new analysis
                    </button>
                  </div>
                  <input ref={projectInputRef} type="file" accept=".json,application/json" onChange={openProject} className="hidden" />
                </div>
              </div>
            )}
          </main>

          {/* TOAST */}
          {toast && (
            <div
              key={toast.key}
              role="status"
              aria-live="polite"
              className={`fixed bottom-6 right-6 font-bold px-4 py-2.5 rounded-xl shadow-2xl text-xs flex items-center gap-3 z-50 ${
                toast.tone === 'warn' ? 'bg-rose-500 text-white' : 'bg-amber-500 text-slate-950'
              }`}
            >
              <i className={`fa-solid ${toast.tone === 'warn' ? 'fa-circle-exclamation' : 'fa-circle-check'}`}></i>
              <span>{toast.msg}</span>
              {toast.action && (
                <button
                  onClick={() => { toast.action.run(); setToast(null); }}
                  className="underline underline-offset-2 hover:no-underline"
                >
                  {toast.action.label}
                </button>
              )}
            </div>
          )}

          {/* SHORTCUTS MODAL */}
          {showShortcutsModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50" onClick={() => setShowShortcutsModal(false)}>
              <div role="dialog" aria-modal="true" aria-label="Keyboard shortcuts" className="bg-cinema-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl" onClick={(e) => e.stopPropagation()}>
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-slate-100 text-sm flex items-center gap-2">
                    <i className="fa-solid fa-keyboard text-amber-400"></i>
                    Keyboard Shortcuts
                  </h3>
                  <button onClick={() => setShowShortcutsModal(false)} className="text-slate-400 hover:text-slate-100" aria-label="Close">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <div className="space-y-2 text-xs">
                  {[
                    ['Play / pause (or start / stop the clock)', 'Space'],
                    ['Mark this moment and start writing', 'M'],
                    ['Save the entry (while typing)', `${MOD_KEY}+Enter`],
                    ['Leave a text box so shortcuts work again', 'Esc'],
                    ['Back 5 seconds (clock: −1s)', '←'],
                    ['Forward 5 seconds (clock: +1s)', '→']
                  ].map(([label, key]) => (
                    <div key={label} className="flex justify-between items-center bg-cinema-950 p-2 rounded-lg border border-slate-800">
                      <span className="text-slate-300">{label}</span>
                      <kbd className="bg-cinema-800 text-amber-400 font-mono px-2 py-0.5 rounded border border-slate-700 whitespace-nowrap">{key}</kbd>
                    </div>
                  ))}
                </div>

                <button
                  onClick={() => setShowShortcutsModal(false)}
                  className="w-full py-2 bg-cinema-800 hover:bg-cinema-700 text-slate-200 font-bold text-xs rounded-xl border border-slate-700"
                >
                  Close
                </button>
              </div>
            </div>
          )}
        </div>

        {/* PRINT REPORT — only visible when printing */}
        <div id="print-report" className="print-only">
          <Report title={filmLabel} metaLine={metaLine} groups={printGroups} show={printShow} excluded={NO_EXCLUSIONS} />
        </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
